<style>

<script>

// ================= CẤU HÌNH NGUỒN DỮ LIỆU GOOGLE SHEETS =================

// Sheet tổng hợp công nợ (gid=1537914786)
const CONGNO_FILE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1537914786&single=true&output=csv";

// Sheet chi tiết công nợ phải thu (gid=1184385929)
const DETAIL_FILE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1184385929&single=true&output=csv";

// ================= TỰ ĐỘNG CÂN CHỈNH VỊ TRÍ GHIM TIÊU ĐỀ BẢNG =================

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--sticky-offset', height + 'px');
    }
}

window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

// ================= DỮ LIỆU =================

let allData = [];
let detailRows = null;

// Trạng thái sắp xếp (null = thứ tự ban đầu: dư nợ giảm dần)
let sortKey = null;
let sortAsc = true;

const TEXT_KEYS = ["ten", "diachi", "nvkd"];
const DATE_KEYS = ["thanhtoan", "muahang"];

// ================= CHUYỂN ĐỔI SỐ =================

function toNumber(value) {
    let s = String(value ?? "").replace(/[\s '"]/g, "");
    if (!s || s === "-") return 0;

    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s[0] === "-") { neg = true; s = s.slice(1); }
    if (!/^[\d.,]+$/.test(s)) return 0;

    const dots = (s.match(/\./g) || []).length;
    const commas = (s.match(/,/g) || []).length;
    let n;

    if (dots && commas) {
        const dec = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
        const thou = dec === "." ? "," : ".";
        n = parseFloat(s.split(thou).join("").replace(dec, "."));
    } else if (commas) {
        n = /^\d{1,3}(,\d{3})+$/.test(s) ? parseFloat(s.replace(/,/g, "")) : parseFloat(s.replace(",", "."));
    } else if (dots) {
        n = /^\d{1,3}(\.\d{3})+$/.test(s) ? parseFloat(s.replace(/\./g, "")) : parseFloat(s);
    } else {
        n = parseFloat(s);
    }

    if (isNaN(n)) return 0;
    return neg ? -n : n;
}

// ================= ĐỊNH DẠNG SỐ & NGÀY =================

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN').format(number);
}

function formatCommaNumber(number) {
    return new Intl.NumberFormat('en-US').format(number);
}

function dateValue(s) {
    const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0;
}

function sortValue(r, key) {
    if (TEXT_KEYS.includes(key)) return (r[key] || "").toLowerCase();
    if (DATE_KEYS.includes(key)) return dateValue(r[key]);
    return toNumber(r[key]);
}

// ================= NẠP DỮ LIỆU (CSV HOẶC EXCEL) =================

function csvToRows(text) {
    text = text.replace(/^\uFEFF/, "");

    const first = text.split(/\r?\n/, 1)[0] || "";
    const cnt = { ",": 0, ";": 0, "\t": 0 };
    let qq = false;
    for (const ch of first) {
        if (ch === '"') qq = !qq;
        else if (!qq && ch in cnt) cnt[ch]++;
    }
    const d = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];

    const out = [];
    let row = [], cur = "", inQ = false;

    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') {
                if (text[i + 1] === '"') { cur += '"'; i++; }
                else inQ = false;
            } else cur += ch;
        } else if (ch === '"') {
            inQ = true;
        } else if (ch === d) {
            row.push(cur); cur = "";
        } else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cur); out.push(row); row = []; cur = "";
        } else {
            cur += ch;
        }
    }
    if (cur !== "" || row.length) { row.push(cur); out.push(row); }

    return out.filter(r => r.some(c => String(c).trim() !== ""));
}

function ingest(rows) {
    allData = [];

    rows.forEach(c => {
        if (c.length < 10) return;

        const s = i => String(c[i] ?? "").trim();

        if (
            s(0).includes('Mã KH') ||
            s(0).includes('M? KH') ||
            s(1).toLowerCase().includes('tổng cộng') ||
            !s(1)
        ) return;

        const vn = i => {
            const n = toNumber(s(i));
            return n === 0 ? "-" : formatNumber(n);
        };

        allData.push({
            ma: s(0),
            ten: s(1),
            diachi: s(2),
            sdt: s(3),
            nvkd: s(4),
            qh1: vn(5),
            qh2: vn(6),
            qh3: vn(7),
            tongqh: vn(8),
            duno: vn(9),
            thanhtoan: s(10),
            muahang: s(11)
        });
    });

    buildNVKD();
    render();
    updateStickyOffset();
}

// Chọn file từ máy: hỗ trợ .xlsx, .xls và .csv
document.getElementById("fileInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;

    if (/\.csv$/i.test(f.name)) {
        f.text().then(t => ingest(csvToRows(t)));
        return;
    }

    f.arrayBuffer().then(buf => {
        try {
            const wb = XLSX.read(buf, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            ingest(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }));
        } catch (err) {
            alert("Không đọc được file Excel: " + err.message);
        }
    });
});

// ================= ĐỌC DỮ LIỆU CÔNG NỢ TỪ GOOGLE SHEETS =================

fetch(`${CONGNO_FILE}&t=${Date.now()}`)
.then(r => {
    if (!r.ok) {
        throw new Error('Không tải được dữ liệu công nợ từ Google Sheets');
    }
    return r.text();
})
.then(text => {
    ingest(csvToRows(text));
})
.catch(error => {
    document.getElementById("dataBody").innerHTML =
        `<tr><td colspan="10" style="text-align:center;color:red">
        Lỗi tải dữ liệu: ${error.message}
        </td></tr>`;
});

// ================= TẠO DANH SÁCH NVKD =================

function buildNVKD() {
    const ds = [
        ...new Set(
            allData
            .map(x => x.nvkd)
            .filter(x => x)
        )
    ];

    const select = document.getElementById("nvkdFilter");
    select.innerHTML = '<option value="">Tất cả NVKD</option>';
    ds.sort((a, b) => a.localeCompare(b, "vi"));

    ds.forEach(x => {
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        select.appendChild(op);
    });
}

// ================= BẤM TIÊU ĐỀ ĐỂ SẮP XẾP =================

function setSort(key) {
    if (sortKey !== key) {
        sortKey = key;
        sortAsc = true;
    } else if (sortAsc) {
        sortAsc = false;
    } else {
        sortKey = null;
        sortAsc = false;
    }
    render();
}

document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => setSort(th.dataset.key));
});

function updateArrows() {
    document.querySelectorAll("th[data-key]").forEach(th => {
        const arr = th.querySelector(".arr");
        if (!arr) return;
        arr.textContent = th.dataset.key === sortKey ? (sortAsc ? " ▲" : " ▼") : "";
    });
}

// ================= HIỂN THỊ DỮ LIỆU =================

function render() {
    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const nvkd = document
        .getElementById("nvkdFilter")
        .value;

    const overdueOnly = document
        .getElementById("overdueOnly")
        .checked;

    const body = document.getElementById("dataBody");
    const mobileList = document.getElementById("mobileList");

    body.innerHTML = "";
    mobileList.innerHTML = "";

    const data = allData.filter(r => {
        const text = (
            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.sdt + " " +
            r.nvkd
        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd)
            && (!overdueOnly || toNumber(r.tongqh) > 0);
    });

    const key = sortKey || "duno";
    const asc = sortKey ? sortAsc : false;

    data.sort((a, b) => {
        const x = sortValue(a, key);
        const y = sortValue(b, key);
        let cmp;
        if (typeof x === "string") cmp = x.localeCompare(y, "vi");
        else cmp = x - y;
        return asc ? cmp : -cmp;
    });

    let tongQH = 0;
    let tongDN = 0;
    let tongQH1 = 0;
    let tongQH2 = 0;
    let tongQH3 = 0;

    const mobileCard = document.createElement("div");
    mobileCard.className = "mobile-table-card";

    const mobileTable = document.createElement("table");
    mobileTable.className = "mobile-table";
    mobileTable.innerHTML = `
        <thead>
            <tr>
                <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                <th data-key="tongqh">Tổng nợ quá hạn<span class="arr"></span></th>
                <th data-key="duno">Dư nợ cuối<span class="arr"></span></th>
            </tr>
        </thead>
    `;
    mobileTable.querySelectorAll("th[data-key]").forEach(th => {
        th.addEventListener("click", () => setSort(th.dataset.key));
    });
    const mobileTbody = document.createElement("tbody");

    data.forEach(r => {
        tongQH += toNumber(r.tongqh);
        tongDN += toNumber(r.duno);
        tongQH1 += toNumber(r.qh1);
        tongQH2 += toNumber(r.qh2);
        tongQH3 += toNumber(r.qh3);

        const tr = document.createElement("tr");
        tr.onclick = () => showDetail(r);

        [
            r.ten,
            r.diachi,
            r.nvkd,
            r.qh1,
            r.qh2,
            r.qh3,
            r.tongqh,
            r.duno,
            r.thanhtoan,
            r.muahang
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
        });

        body.appendChild(tr);

        const mTr = document.createElement("tr");
        mTr.onclick = () => showDetail(r);

        const tdTen = document.createElement("td");
        tdTen.textContent = r.ten || "Chưa có tên khách hàng";

        const tdQH = document.createElement("td");
        tdQH.textContent = r.tongqh || "0";

        const tdDN = document.createElement("td");
        tdDN.textContent = r.duno || "0";

        mTr.appendChild(tdTen);
        mTr.appendChild(tdQH);
        mTr.appendChild(tdDN);
        mobileTbody.appendChild(mTr);
    });

    document.getElementById("emptyTable")
        .style.display = data.length === 0 ? "block" : "none";

    if (data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "Không tìm thấy khách hàng";
        mobileList.appendChild(empty);
    } else {
        mobileTable.appendChild(mobileTbody);
        mobileCard.appendChild(mobileTable);
        mobileList.appendChild(mobileCard);
    }

    document.getElementById("tongkh").innerText = formatNumber(data.length);
    document.getElementById("tongqh").innerText = formatNumber(tongQH);
    document.getElementById("tongdn").innerText = formatNumber(tongDN);
    document.getElementById("tongqh1").innerText = formatNumber(tongQH1);
    document.getElementById("tongqh2").innerText = formatNumber(tongQH2);
    document.getElementById("tongqh3").innerText = formatNumber(tongQH3);

    updateArrows();
}

// ================= TÌM KIẾM / LỌC =================

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("nvkdFilter").addEventListener("change", render);
document.getElementById("overdueOnly").addEventListener("change", render);

// ================= CHI TIẾT KHÁCH HÀNG =================

function showDetail(r) {
    document.getElementById("modal").style.display = "block";

    const detail = document.getElementById("detail");
    detail.innerHTML = "";

    const h2 = document.createElement("h2");
    h2.textContent = r.ten;
    detail.appendChild(h2);

    const cleanSdt = (r.sdt || "").trim();
    const sdtDisplay = cleanSdt && cleanSdt !== "0" ? cleanSdt : "Chưa cập nhật";

    const fields = [
        ["Mã KH:", r.ma],
        ["Số điện thoại:", sdtDisplay, true],
        ["Địa chỉ:", r.diachi],
        ["NVKD:", r.nvkd],
        ["Quá hạn 1 tháng:", r.qh1],
        ["Quá hạn 2 tháng:", r.qh2],
        ["Quá hạn 3 tháng:", r.qh3],
        ["Tổng công nợ quá hạn:", r.tongqh],
        ["Dư nợ cuối ngày:", r.duno],
        ["Ngày thanh toán gần nhất:", r.thanhtoan],
        ["Ngày mua hàng gần nhất:", r.muahang]
    ];

    fields.forEach((item, index) => {
        if (index === 4 || index === 9) {
            detail.appendChild(document.createElement("hr"));
        }

        const p = document.createElement("p");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0] + " ";
        p.appendChild(label);

        if (item[2] && item[1] !== "Chưa cập nhật") {
            const link = document.createElement("a");
            link.href = "tel:" + item[1].replace(/[^0-9+]/g, '');
            link.className = "phone-link";
            link.textContent = item[1];
            p.appendChild(link);
        } else {
            p.appendChild(document.createTextNode(item[1] || "Chưa cập nhật"));
        }

        detail.appendChild(p);
    });

    const dcBtn = document.createElement("button");
    dcBtn.type = "button";
    dcBtn.className = "dc-btn-open";
    dcBtn.textContent = "Đối chiếu công nợ";
    dcBtn.onclick = () => openRecon(r);
    detail.appendChild(dcBtn);
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

window.addEventListener("click", e => {
    const modal = document.getElementById("modal");
    const dcModal = document.getElementById("dcModal");
    if (e.target === modal) closeModal();
    if (e.target === dcModal) closeRecon();

// ================= ĐỐI CHIẾU CÔNG NỢ (chitietcongnophaithu) =================

let currentCustomer = null;
let currentDataUrl = "";

function showToast(msg) {
    const toast = document.getElementById("dcToast");
    toast.textContent = msg;
    toast.style.display = "block";
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
        toast.style.display = "none";
    }, 3000);
}

async function ensureDetailRows() {
    if (detailRows) return detailRows;

    const res = await fetch(`${DETAIL_FILE}&t=${Date.now()}`);
    if (!res.ok) {
        throw new Error("Không tải được sheet chi tiết công nợ phải thu");
    }
    const text = await res.text();
    detailRows = csvToRows(text);
    return detailRows;
}

function parseDateAny(val) {
    const s = String(val || "").trim();
    if (!s) return null;

    // dd/mm/yyyy hoặc dd-mm-yyyy
    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) {
        return new Date(+m[3], +m[2] - 1, +m[1]);
    }

    // yyyy-mm-dd
    m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (m) {
        return new Date(+m[1], +m[2] - 1, +m[3]);
    }

    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
}

function toInputDate(d) {
    if (!d || isNaN(d.getTime())) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}

function formatDateVN(d) {
    if (!d || isNaN(d.getTime())) return "";
    const day = String(d.getDate()).padStart(2, "0");
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const y = d.getFullYear();
    return `${day}/${m}/${y}`;
}

function extractCustomerTransactions(rows, customer) {
    const targetMa = String(customer.ma || "").trim().toLowerCase();
    const targetTen = String(customer.ten || "").trim().toLowerCase();
    const tx = [];

    for (const r of rows) {
        if (!Array.isArray(r) || r.length < 2) continue;

        const c0 = String(r[0] || "").trim().toLowerCase();
        const c1 = String(r[1] || "").trim().toLowerCase();
        const c2 = String(r[2] || "").trim().toLowerCase();

        // Bỏ qua dòng tiêu đề hoặc tổng cộng
        if (c0.includes("mã") || c1.includes("tổng cộng")) continue;

        const matchMa = targetMa && (c0 === targetMa || c1 === targetMa);
        const matchTen = targetTen && (c1 === targetTen || c2 === targetTen);
        if (!matchMa && !matchTen) continue;

        // Tìm ngày và các số phát sinh/ghi có/dư nợ trên dòng
        let dt = null;
        for (const cell of r) {
            const parsed = parseDateAny(cell);
            if (parsed) {
                dt = parsed;
                break;
            }
        }

        const nums = [];
        for (let i = 1; i < r.length; i++) {
            const raw = String(r[i] || "").trim();
            if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(raw)) continue;
            const n = toNumber(raw);
            if (n !== 0) nums.push(n);
        }

        tx.push({
            date: dt,
            dateStr: dt ? formatDateVN(dt) : String(r[2] || ""),
            desc: String(r[3] || r[2] || "Phát sinh công nợ").trim(),
            debit: nums[0] || 0,
            credit: nums[1] || 0,
            balance: nums.length >= 3 ? nums[nums.length - 1] : (nums[0] || 0),
            raw: r
        });
    }

    return tx;
}

function renderReconImage(customer, transactions, fromDateStr) {
    const fromDate = fromDateStr ? new Date(fromDateStr + "T00:00:00") : null;
    const filtered = fromDate
        ? transactions.filter(t => !t.date || t.date >= fromDate)
        : transactions;

    const canvas = document.createElement("canvas");
    const width = 1000;
    const rowHeight = 44;
    const headerHeight = 230;
    const footerHeight = 90;
    const height = Math.max(420, headerHeight + Math.max(1, filtered.length) * rowHeight + footerHeight);

    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#0f4c81";
    ctx.font = "bold 28px Arial";
    ctx.fillText("BẢNG ĐỐI CHIẾU CÔNG NỢ KHÁCH HÀNG", 40, 52);

    ctx.fillStyle = "#222222";
    ctx.font = "bold 20px Arial";
    ctx.fillText(`Khách hàng: ${customer.ten || ""} (${customer.ma || ""})`, 40, 92);

    ctx.font = "18px Arial";
    ctx.fillStyle = "#444444";
    ctx.fillText(`Địa chỉ: ${customer.diachi || "Chưa cập nhật"}`, 40, 122);
    ctx.fillText(
        `Từ ngày: ${fromDate ? formatDateVN(fromDate) : "Tất cả"}   |   Dư nợ hiện tại: ${customer.duno || "0"}`,
        40,
        152
    );

    // Tiêu đề bảng chi tiết
    const tableTop = 180;
    ctx.fillStyle = "#0f4c81";
    ctx.fillRect(40, tableTop, width - 80, 42);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 17px Arial";
    ctx.fillText("Ngày", 52, tableTop + 27);
    ctx.fillText("Nội dung / Chứng từ", 170, tableTop + 27);
    ctx.fillText("Phát sinh / Nợ", 630, tableTop + 27);
    ctx.fillText("Dư nợ", 810, tableTop + 27);

    let y = tableTop + 42;
    if (filtered.length === 0) {
        ctx.fillStyle = "#666666";
        ctx.font = "18px Arial";
        ctx.fillText("Không có dòng chi tiết phù hợp trong kỳ đã chọn.", 52, y + 30);
        y += rowHeight;
    } else {
        filtered.forEach((item, idx) => {
            if (idx % 2 === 1) {
                ctx.fillStyle = "#f4f7fb";
                ctx.fillRect(40, y, width - 80, rowHeight);
            }
            ctx.strokeStyle = "#dddddd";
            ctx.strokeRect(40, y, width - 80, rowHeight);

            ctx.fillStyle = "#222222";
            ctx.font = "17px Arial";
            ctx.fillText(item.dateStr || "-", 52, y + 28);
            ctx.fillText(String(item.desc || "").slice(0, 42), 170, y + 28);

            ctx.textAlign = "right";
            ctx.fillText(item.debit ? formatCommaNumber(item.debit) : "-", 750, y + 28);
            ctx.fillText(item.balance ? formatCommaNumber(item.balance) : "-", 945, y + 28);
            ctx.textAlign = "left";

            y += rowHeight;
        });
    }

    ctx.fillStyle = "#0f4c81";
    ctx.font = "bold 18px Arial";
    ctx.fillText(`Tổng số dòng chi tiết: ${filtered.length}`, 40, y + 36);

    currentDataUrl = canvas.toDataURL("image/png");
    const img = document.getElementById("dcImg");
    img.src = currentDataUrl;
    img.style.display = "block";

    document.getElementById("dcDownload").disabled = false;
    document.getElementById("dcZalo").disabled = false;
}

async function generateRecon() {
    if (!currentCustomer) return;

    const info = document.getElementById("dcInfo");
    const errBox = document.getElementById("dcError");
    const errText = document.getElementById("dcErrorText");
    const fromInput = document.getElementById("dcFrom");

    errBox.style.display = "none";
    info.textContent = "Đang tải dữ liệu chi tiết công nợ phải thu...";

    try {
        const rows = await ensureDetailRows();
        const tx = extractCustomerTransactions(rows, currentCustomer);

        if (!fromInput.value && tx.length > 0) {
            const dates = tx.map(t => t.date).filter(Boolean).sort((a, b) => a - b);
            if (dates.length > 0) {
                fromInput.value = toInputDate(dates[0]);
            }
        }

        renderReconImage(currentCustomer, tx, fromInput.value);
        info.textContent = `Khách hàng: ${currentCustomer.ten} — Tìm thấy ${tx.length} dòng chi tiết từ sheet chitietcongnophaithu.`;
    } catch (err) {
        info.textContent = "Không thể tự động tải dữ liệu chi tiết.";
        errText.textContent = `Lỗi tải chi tiết công nợ: ${err.message}. Bạn có thể chọn file CSV thủ công bên dưới:`;
        errBox.style.display = "block";
    }
}

function openRecon(customer) {
    currentCustomer = customer;
    document.getElementById("dcFrom").value = "";
    document.getElementById("dcImg").style.display = "none";
    document.getElementById("dcDownload").disabled = true;
    document.getElementById("dcZalo").disabled = true;
    document.getElementById("dcModal").style.display = "block";
    generateRecon();
}

function closeRecon() {
    document.getElementById("dcModal").style.display = "none";
}

document.getElementById("dcClose").addEventListener("click", closeRecon);
document.getElementById("dcFrom").addEventListener("change", generateRecon);
document.getElementById("dcAuto").addEventListener("click", () => {
    document.getElementById("dcFrom").value = "";
    generateRecon();
});

document.getElementById("dcCsv").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f || !currentCustomer) return;
    f.text().then(t => {
        detailRows = csvToRows(t);
        generateRecon();
    });
});

document.getElementById("dcDownload").addEventListener("click", () => {
    if (!currentDataUrl || !currentCustomer) return;
    const a = document.createElement("a");
    a.href = currentDataUrl;
    a.download = `Doi_chieu_cong_no_${(currentCustomer.ma || currentCustomer.ten || "KH").replace(/\s+/g, "_")}.png`;
    a.click();
    showToast("Đã tải ảnh bảng đối chiếu công nợ");
});

document.getElementById("dcZalo").addEventListener("click", async () => {
    if (!currentDataUrl || !currentCustomer) return;
    try {
        const res = await fetch(currentDataUrl);
        const blob = await res.blob();
        const file = new File([blob], "doi-chieu-cong-no.png", { type: "image/png" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                title: `Đối chiếu công nợ - ${currentCustomer.ten}`,
                text: `Bảng đối chiếu công nợ khách hàng ${currentCustomer.ten}`,
                files: [file]
            });
            return;
        }
    } catch (_) {}

    const a = document.createElement("a");
    a.href = currentDataUrl;
    a.download = `Doi_chieu_cong_no_${(currentCustomer.ma || "KH").replace(/\s+/g, "_")}.png`;
    a.click();
    showToast("Đã tải ảnh — mở Zalo và gửi ảnh vừa tải cho khách hàng.");
});
