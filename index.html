<!DOCTYPE html>
<html lang="vi">
<head>

<title>Tra cứu công nợ khách hàng</title>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= KHU VỰC GHIM ĐẦU TRANG ================= */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f3f4f6;
    padding-top: 12px;
    padding-bottom: 8px;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 34px;
    font-weight: bold;
    margin: 4px 0 14px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

input, select {
    padding: 12px 14px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 260px;
    font-size: 20px;
    background: white;
    color: #222;
}

#searchInput {
    flex: 1;
}

/* Ô tích chọn lọc */
.check-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}

.check-filter input[type=checkbox] {
    min-width: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    cursor: pointer;
}

/* Ô chọn file Excel */
.file-pick {
    font-size: 18px;
}

.file-pick input[type=file] {
    min-width: 0;
    width: auto;
    padding: 6px;
    font-size: 16px;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(6, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 4px;
}

.stat {
    background: #0f4c81;
    color: white;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
}

.stat.qh-sub {
    background: #1b639e;
}

.stat h2 {
    font-size: 28px;
    margin: 8px 0 2px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU ================= */

.table-container {
    overflow: visible;
    width: 100%;
    padding-top: 0;
}

table {
    width: 100%;
    min-width: 1500px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: white;
}

thead th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: var(--sticky-offset, 290px);
    z-index: 100;
    font-size: 23px;
    font-weight: bold;
    text-align: center !important;
    vertical-align: middle;
    white-space: normal;
    box-shadow: 0 2px 3px rgba(0,0,0,.15);
    cursor: pointer;
    user-select: none;
}

thead th:hover {
    background: #0b3961;
}

th, td {
    padding: 14px 12px;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 23px;
    line-height: 1.5;
    vertical-align: middle;
}

th:first-child,
td:first-child {
    border-left: 1px solid #ccc;
}

thead th {
    border-top: 1px solid #ccc;
}

td:nth-child(1) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(1) { width: 190px; }

td:nth-child(2) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(2) { width: 190px; }

td:nth-child(3) {
    width: 155px;
    text-align: center;
    overflow-wrap: anywhere;
}
th:nth-child(3) { width: 155px; }

td:nth-child(4),
td:nth-child(5),
td:nth-child(6) {

    text-align: right;
    white-space: nowrap;
}
th:nth-child(4), th:nth-child(5), th:nth-child(6) { width: 125px; }

td:nth-child(7),
td:nth-child(8) {
    width: 155px;
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
}
th:nth-child(7), th:nth-child(8) { width: 155px; }

td:nth-child(9),
td:nth-child(10) {

    text-align: center;
    white-space: nowrap;
}

}

tbody tr:hover {

}

/* ================= THÔNG BÁO ================= */

.empty-message {

}

/* ================= DANH SÁCH ĐIỆN THOẠI ================= */

}

.mobile-table-card {

}

.mobile-table thead th {

.mobile-table tbody td {

@media (max-width: 768px) {

        font-size: 28px;

    .check-filter {

    }

    }

    .stat {
        min-width: 0;
        padding: 12px 16px;
        font-size: 19px;
    }

    .stat h2 {
        font-size: 26px;

    .table-container {

    .mobile-list {
        display: block;
    }

    .mobile-table thead th {
        cursor: pointer;
        user-select: none;

        padding: 10px;

    .modal-content {
        margin: 10px auto;

        font-size: 21px;

        font-size: 25px;

}

@media (max-width: 380px) {

    }

}

<script>

// ================= TỰ ĐỘNG CÂN CHỈNH VỊ TRÍ GHIM TIÊU ĐỀ BẢNG =================

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--sticky-offset', height + 'px');
    }
}

window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

// ================= DỮ LIỆU =================

const CONGNO_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1537914786&single=true&output=csv";
const DETAIL_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1184385929&single=true&output=csv";

let allData = [];

// Trạng thái sắp xếp (null = thứ tự ban đầu: dư nợ giảm dần)
let sortKey = null;
let sortAsc = true;

const TEXT_KEYS = ["ten", "diachi", "nvkd"];
const DATE_KEYS = ["thanhtoan", "muahang"];

// ================= CHUYỂN ĐỔI SỐ & NGÀY =================

function toNumber(value) {
    let s = String(value ?? "").replace(/[\s\u00A0'"]/g, "");
    if (!s || s === "-") return 0;

    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s[0] === "-") { neg = true; s = s.slice(1); }
    if (!/^[\d.,]+$/.test(s)) return 0;

    const dots = (s.match(/\./g) || []).length;
    const commas = (s.match(/,/g) || []).length;
    let n;

    if (dots && commas) {
        const dec = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
        const thou = dec === "." ? "," : ".";
        n = parseFloat(s.split(thou).join("").replace(dec, "."));
    } else if (commas) {
        n = /^\d{1,3}(,\d{3})+$/.test(s) ? parseFloat(s.replace(/,/g, "")) : parseFloat(s.replace(",", "."));
    } else if (dots) {
        n = /^\d{1,3}(\.\d{3})+$/.test(s) ? parseFloat(s.replace(/\./g, "")) : parseFloat(s);
    } else {
        n = parseFloat(s);
    }

    if (isNaN(n)) return 0;
    return neg ? -n : n;
}

// Chuyển chuỗi ngày bất kỳ (dd/mm/yyyy, dd/mm/yy, yyyy-mm-dd, mm/dd/yyyy) thành đối tượng {d, mo, y} theo chuẩn dd/mm/yy
function parseDateParts(raw) {
    const s = String(raw || "").trim();
    if (!s) return null;

    let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
    if (m) {
        return { d: +m[3], mo: +m[2], y: +m[1] };
    }

    m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})$/);
    if (m) {
        let p1 = +m[1], p2 = +m[2], y = +m[3];
        if (y < 100) y += 2000;
        let d = p1, mo = p2;
        if (p1 <= 12 && p2 > 12) {
            mo = p1;
            d = p2;
        }
        if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
            return { d, mo, y };
        }
    }

    return null;
}

// Trả về chuỗi dd/mm/yy
function formatDateDDMMYY(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    const p = parseDateParts(s);
    if (!p) return s;
    return String(p.d).padStart(2, "0") + "/" + String(p.mo).padStart(2, "0") + "/" + String(p.y % 100).padStart(2, "0");
}

function toYMD(raw) {
    const p = parseDateParts(raw);
    return p ? p.y * 10000 + p.mo * 100 + p.d : 0;
}

function fmtYMD(n) {
    if (!n) return "";
    const y = Math.floor(n / 10000) % 100;
    const mo = Math.floor(n / 100) % 100;
    const d = n % 100;
    return String(d).padStart(2, "0") + "/" + String(mo).padStart(2, "0") + "/" + String(y).padStart(2, "0");
}

function ymdToInput(n) {
    const y = Math.floor(n / 10000);
    const mo = Math.floor(n / 100) % 100;
    const d = n % 100;
    return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

// ================= ĐỊNH DẠNG SỐ & CHỮ =================

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN').format(number);
}

function numberToVietnameseWords(amount) {
    const rounded = Math.round(Number(amount) || 0);
    if (rounded === 0) return "Không đồng";

    const neg = rounded < 0;
    let num = Math.abs(rounded);

    const units = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
    const scales = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];

    function readThreeDigits(n, hasHigher) {
        const hundred = Math.floor(n / 100);
        const ten = Math.floor((n % 100) / 10);
        const one = n % 10;
        const parts = [];

        if (hundred > 0) {
            parts.push(units[hundred] + " trăm");
        } else if (hasHigher && (ten > 0 || one > 0)) {
            parts.push("không trăm");
        }

        if (ten > 1) {
            parts.push(units[ten] + " mươi");
            if (one === 1) parts.push("mốt");
            else if (one === 4) parts.push("tư");
            else if (one === 5) parts.push("lăm");
            else if (one > 0) parts.push(units[one]);
        } else if (ten === 1) {
            parts.push("mười");
            if (one === 5) parts.push("lăm");
            else if (one > 0) parts.push(units[one]);
        } else if (one > 0) {
            if (hundred > 0 || hasHigher) parts.push("linh");
            parts.push(units[one]);
        }

        return parts.join(" ");
    }

    const groups = [];
    while (num > 0) {
        groups.push(num % 1000);
        num = Math.floor(num / 1000);
    }

    const chunks = [];
    for (let i = groups.length - 1; i >= 0; i--) {
        const g = groups[i];
        if (g > 0) {
            const hasHigher = i < groups.length - 1;
            const text = readThreeDigits(g, hasHigher);
            chunks.push(text + (scales[i] ? " " + scales[i] : ""));
        }
    }

    let result = chunks.join(", ").trim();
    result = result.charAt(0).toUpperCase() + result.slice(1);
    if (neg) result = "Âm " + result.charAt(0).toLowerCase() + result.slice(1);

    const isExactThousand = (Math.abs(rounded) % 1000 === 0);
    return result + " đồng" + (isExactThousand ? " chẵn" : "");
}

function sortValue(r, key) {
    if (TEXT_KEYS.includes(key)) return (r[key] || "").toLowerCase();
    if (DATE_KEYS.includes(key)) return toYMD(r[key]);
    return toNumber(r[key]);
}

// ================= NẠP DỮ LIỆU (CSV HOẶC EXCEL) =================

function csvToRows(text) {
    text = text.replace(/^\uFEFF/, "");

    const first = text.split(/\r?\n/, 1)[0] || "";
    const cnt = { ",": 0, ";": 0, "\t": 0 };
    let qq = false;
    for (const ch of first) {
        if (ch === '"') qq = !qq;
        else if (!qq && ch in cnt) cnt[ch]++;
    }
    const d = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || ",";

    const out = [];
    let row = [], cur = "", inQ = false;

    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') {
                if (text[i + 1] === '"') { cur += '"'; i++; }
                else inQ = false;
            } else cur += ch;
        } else if (ch === '"') {
            inQ = true;
        } else if (ch === d) {
            row.push(cur); cur = "";
        } else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cur); out.push(row); row = []; cur = "";
        } else {
            cur += ch;
        }
    }
    if (cur !== "" || row.length) { row.push(cur); out.push(row); }

    return out.filter(r => r.some(c => String(c).trim() !== ""));
}

function ingest(rows) {
    allData = [];

    rows.forEach(c => {
        if (c.length < 10) return;

        const s = i => String(c[i] ?? "").trim();

        if (
            s(0).includes('Mã KH') ||
            s(0).includes('M? KH') ||
            s(1).toLowerCase().includes('tổng cộng') ||
            !s(1)
        ) return;

        const vn = i => { const n = toNumber(s(i)); return n === 0 ? "-" : formatNumber(n); };

        allData.push({
            ma: s(0),
            ten: s(1),
            diachi: s(2),
            sdt: s(3),
            nvkd: s(4),
            qh1: vn(5),
            qh2: vn(6),
            qh3: vn(7),
            tongqh: vn(8),
            duno: vn(9),
            thanhtoan: formatDateDDMMYY(s(10)),
            muahang: formatDateDDMMYY(s(11))
        });
    });

    buildNVKD();
    render();
    updateStickyOffset();
}

document.getElementById("fileInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;

    if (/\.csv$/i.test(f.name)) {
        f.text().then(t => ingest(csvToRows(t)));
        return;
    }

    f.arrayBuffer().then(buf => {
        try {
            const wb = XLSX.read(buf, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            ingest(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }));
        } catch (err) {
            alert("Không đọc được file Excel: " + err.message);
        }
    });
});

// ================= TẠO DANH SÁCH NVKD =================

function buildNVKD() {
    const ds = [
        ...new Set(
            allData
            .map(x => x.nvkd)
            .filter(x => x)
        )
    ];

    const select = document.getElementById("nvkdFilter");
    select.innerHTML = '<option value="">Tất cả NVKD</option>';
    ds.sort();

    ds.forEach(x => {
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        select.appendChild(op);
    });
}

// ================= BẤM TIÊU ĐỀ ĐỂ SẮP XẾP =================

function setSort(key) {
    if (sortKey !== key) {
        sortKey = key;
        sortAsc = true;
    } else if (sortAsc) {
        sortAsc = false;
    } else {
        sortKey = null;
        sortAsc = false;
    }
    render();
}

document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => setSort(th.dataset.key));
});

function updateArrows() {
    document.querySelectorAll("th[data-key]").forEach(th => {
        const arr = th.querySelector(".arr");
        if (!arr) return;
        arr.textContent = th.dataset.key === sortKey ? (sortAsc ? " ▲" : " ▼") : "";
    });
}

// ================= HIỂN THỊ DỮ LIỆU =================

function render() {
    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const nvkd = document
        .getElementById("nvkdFilter")
        .value;

    const overdueOnly = document
        .getElementById("overdueOnly")
        .checked;

    const body = document.getElementById("dataBody");
    const mobileList = document.getElementById("mobileList");

    body.innerHTML = "";
    mobileList.innerHTML = "";

    const data = allData.filter(r => {
        const text = (
            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.sdt + " " +
            r.nvkd
        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd)
            && (!overdueOnly || toNumber(r.tongqh) > 0);
    });

    const key = sortKey || "duno";
    const asc = sortKey ? sortAsc : false;

    data.sort((a, b) => {
        const x = sortValue(a, key);
        const y = sortValue(b, key);
        let cmp;
        if (typeof x === "string") cmp = x.localeCompare(y, "vi");
        else cmp = x - y;
        return asc ? cmp : -cmp;
    });

    let tongQH1 = 0;
    let tongQH2 = 0;
    let tongQH3 = 0;
    let tongQH = 0;
    let tongDN = 0;

    const mobileCard = document.createElement("div");
    mobileCard.className = "mobile-table-card";

    const mobileTable = document.createElement("table");
    mobileTable.className = "mobile-table";
    mobileTable.innerHTML = `
        <thead>
            <tr>
                <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                <th data-key="tongqh">Tổng nợ quá hạn<span class="arr"></span></th>
                <th data-key="duno">Dư nợ cuối<span class="arr"></span></th>
            </tr>
        </thead>
    `;
    mobileTable.querySelectorAll("th[data-key]").forEach(th => {
        th.addEventListener("click", () => setSort(th.dataset.key));
    });
    const mobileTbody = document.createElement("tbody");

    data.forEach(r => {
        tongQH1 += toNumber(r.qh1);
        tongQH2 += toNumber(r.qh2);
        tongQH3 += toNumber(r.qh3);
        tongQH += toNumber(r.tongqh);
        tongDN += toNumber(r.duno);

        const tr = document.createElement("tr");
        tr.onclick = () => showDetail(r);

        [
            r.ten,
            r.diachi,
            r.nvkd,
            r.qh1,
            r.qh2,
            r.qh3,
            r.tongqh,
            r.duno,
            formatDateDDMMYY(r.thanhtoan),
            formatDateDDMMYY(r.muahang)
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
        });

        body.appendChild(tr);

        const mTr = document.createElement("tr");
        mTr.onclick = () => showDetail(r);

        const tdTen = document.createElement("td");
        tdTen.textContent = r.ten || "Chưa có tên khách hàng";

        const tdQH = document.createElement("td");
        tdQH.textContent = r.tongqh || "0";

        const tdDN = document.createElement("td");
        tdDN.textContent = r.duno || "0";

        mTr.appendChild(tdTen);
        mTr.appendChild(tdQH);
        mTr.appendChild(tdDN);
        mobileTbody.appendChild(mTr);
    });

    document.getElementById("emptyTable")
        .style.display = data.length === 0 ? "block" : "none";

    if (data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "Không tìm thấy khách hàng";
        mobileList.appendChild(empty);
    } else {
        mobileTable.appendChild(mobileTbody);
        mobileCard.appendChild(mobileTable);
        mobileList.appendChild(mobileCard);
    }

    document.getElementById("tongkh").innerText = formatNumber(data.length);
    document.getElementById("tongqh1").innerText = formatNumber(tongQH1);
    document.getElementById("tongqh2").innerText = formatNumber(tongQH2);
    document.getElementById("tongqh3").innerText = formatNumber(tongQH3);
    document.getElementById("tongqh").innerText = formatNumber(tongQH);
    document.getElementById("tongdn").innerText = formatNumber(tongDN);

    updateArrows();
}

function showDetail(r) {
    document.getElementById("modal").style.display = "block";

    const detail = document.getElementById("detail");
    detail.innerHTML = "";

    const h2 = document.createElement("h2");
    h2.textContent = r.ten;
    detail.appendChild(h2);

    const cleanSdt = (r.sdt || "").trim();
    const sdtDisplay = cleanSdt && cleanSdt !== "0" ? cleanSdt : "Chưa cập nhật";

    const fields = [
        ["Mã KH:", r.ma],
        ["Số điện thoại:", sdtDisplay, true],
        ["Địa chỉ:", r.diachi],
        ["NVKD:", r.nvkd],
        ["Quá hạn 1 tháng:", r.qh1],
        ["Quá hạn 2 tháng:", r.qh2],
        ["Quá hạn 3 tháng:", r.qh3],
        ["Tổng công nợ quá hạn:", r.tongqh],
        ["Dư nợ cuối ngày:", r.duno],
        ["Ngày thanh toán gần nhất:", formatDateDDMMYY(r.thanhtoan)],
        ["Ngày mua hàng gần nhất:", formatDateDDMMYY(r.muahang)]
    ];

    fields.forEach((item, index) => {
        if (index === 4 || index === 9) {
            detail.appendChild(document.createElement("hr"));
        }

        const p = document.createElement("p");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0] + " ";
        p.appendChild(label);

        if (item[2] && item[1] !== "Chưa cập nhật") {
            const link = document.createElement("a");
            link.href = "tel:" + item[1].replace(/[^0-9+]/g, '');
            link.className = "phone-link";
            link.textContent = item[1];
            p.appendChild(link);
        } else {
            p.appendChild(document.createTextNode(item[1] || "Chưa cập nhật"));
        }

        detail.appendChild(p);
    });

    const dcBtn = document.createElement("button");
    dcBtn.type = "button";
    dcBtn.className = "dc-btn-open";
    dcBtn.textContent = "Đối chiếu công nợ";
    dcBtn.onclick = () => openRecon(r);
    detail.appendChild(dcBtn);
}
