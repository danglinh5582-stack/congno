<script>

// ================= CẤU HÌNH NGUỒN DỮ LIỆU GOOGLE SHEETS =================

// Sheet tổng hợp công nợ (gid=1537914786)
const CONGNO_FILE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1537914786&single=true&output=csv";

// Sheet chi tiết công nợ phải thu (gid=1184385929)
const DETAIL_FILE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1184385929&single=true&output=csv";

const COMPANY_INFO = {
    name: "CÔNG TY TNHH TÂN ĐẠT VIỆT NAM",
    address: "Khu Liên Phương, phường Nông Trang, Tỉnh Phú Thọ",
    bank: "STK: 113 002 633 897 Ngân hàng Vietinbank",
    notes: [
        "Lưu ý:",
        "- Công ty chỉ có một số tài khoản trên, mọi số tài khoản khác đều không hợp lệ.",
        "- Mọi thắc mắc và khiếu nại xin vui lòng gọi về số điện thoại (kèm zalo) trực tiếp CTHDTV - GĐ: 0986.378.288 và 0941.266.688 - Mr. Nguyễn Thông."
    ]
};

// ================= TỰ ĐỘNG CÂN CHỈNH VỊ TRÍ GHIM TIÊU ĐỀ BẢNG =================

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--sticky-offset', height + 'px');
    }
}

window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

// ================= DỮ LIỆU =================

let allData = [];
let detailRows = null;

// Trạng thái sắp xếp (null = thứ tự ban đầu: dư nợ giảm dần)
let sortKey = null;
let sortAsc = true;

const TEXT_KEYS = ["ten", "diachi", "nvkd"];
const DATE_KEYS = ["thanhtoan", "muahang"];

// ================= CHUYỂN ĐỔI SỐ =================

function toNumber(value) {
    let s = String(value ?? "").replace(/[\s '"]/g, "");
    if (!s || s === "-") return 0;

    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s[0] === "-") { neg = true; s = s.slice(1); }
    if (!/^[\d.,]+$/.test(s)) return 0;

    const dots = (s.match(/\./g) || []).length;
    const commas = (s.match(/,/g) || []).length;
    let n;

    if (dots && commas) {
        const dec = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
        const thou = dec === "." ? "," : ".";
        n = parseFloat(s.split(thou).join("").replace(dec, "."));
    } else if (commas) {
        n = /^\d{1,3}(,\d{3})+$/.test(s) ? parseFloat(s.replace(/,/g, "")) : parseFloat(s.replace(",", "."));
    } else if (dots) {
        n = /^\d{1,3}(\.\d{3})+$/.test(s) ? parseFloat(s.replace(/\./g, "")) : parseFloat(s);
    } else {
        n = parseFloat(s);
    }

    if (isNaN(n)) return 0;
    return neg ? -n : n;
}

// ================= ĐỊNH DẠNG SỐ, NGÀY & TIỀN BẰNG CHỮ =================

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN').format(number);
}

function formatCommaNumber(number) {
    return new Intl.NumberFormat('en-US').format(Math.round(number));
}

function dateValue(s) {
    const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0;
}

function sortValue(r, key) {
    if (TEXT_KEYS.includes(key)) return (r[key] || "").toLowerCase();
    if (DATE_KEYS.includes(key)) return dateValue(r[key]);
    return toNumber(r[key]);
}

function numberToVietnameseWords(num) {
    num = Math.round(Number(num) || 0);
    if (num === 0) return "Không đồng chẵn";
    const neg = num < 0 ? "Âm " : "";
    num = Math.abs(num);

    const chuSo = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
    const hangDonVi = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];

    function docBlockBaSo(n, coHangTram) {
        let tram = Math.floor(n / 100);
        let chuc = Math.floor((n % 100) / 10);
        let donvi = n % 10;
        let parts = [];

        if (tram > 0 || coHangTram) {
            parts.push(chuSo[tram] + " trăm");
        }

        if (chuc > 1) {
            parts.push(chuSo[chuc] + " mươi");
            if (donvi === 1) parts.push("mốt");
            else if (donvi === 4) parts.push("tư");
            else if (donvi === 5) parts.push("lăm");
            else if (donvi > 0) parts.push(chuSo[donvi]);
        } else if (chuc === 1) {
            parts.push("mười");
            if (donvi === 5) parts.push("lăm");
            else if (donvi > 0) parts.push(chuSo[donvi]);
        } else if (donvi > 0) {
            if (tram > 0 || coHangTram) parts.push("linh");
            parts.push(chuSo[donvi]);
        }

        return parts.join(" ");
    }

    let i = 0;
    let segments = [];
    while (num > 0) {
        let block = num % 1000;
        if (block > 0) {
            let coTram = Math.floor(num / 1000) > 0;
            let textBlock = docBlockBaSo(block, coTram);
            let donVi = hangDonVi[i] ? " " + hangDonVi[i] : "";
            segments.unshift(textBlock + donVi);
        }
        num = Math.floor(num / 1000);
        i++;
    }

    let result = segments.join(", ").trim();
    result = result.charAt(0).toUpperCase() + result.slice(1);
    return neg + result + " đồng chẵn";
}

// ================= NẠP DỮ LIỆU (CSV HOẶC EXCEL) =================

function csvToRows(text) {
    text = text.replace(/^\uFEFF/, "");

    const first = text.split(/\r?\n/, 1)[0] || "";
    const cnt = { ",": 0, ";": 0, "\t": 0 };
    let qq = false;
    for (const ch of first) {
        if (ch === '"') qq = !qq;
        else if (!qq && ch in cnt) cnt[ch]++;
    }
    const d = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];

    const out = [];
    let row = [], cur = "", inQ = false;

    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') {
                if (text[i + 1] === '"') { cur += '"'; i++; }
                else inQ = false;
            } else cur += ch;
        } else if (ch === '"') {
            inQ = true;
        } else if (ch === d) {
            row.push(cur); cur = "";
        } else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cur); out.push(row); row = []; cur = "";
        } else {
            cur += ch;
        }
    }
    if (cur !== "" || row.length) { row.push(cur); out.push(row); }

    return out.filter(r => r.some(c => String(c).trim() !== ""));
}

function ingest(rows) {
    allData = [];

    rows.forEach(c => {
        if (c.length < 10) return;

        const s = i => String(c[i] ?? "").trim();

        if (
            s(0).includes('Mã KH') ||
            s(0).includes('M? KH') ||
            s(1).toLowerCase().includes('tổng cộng') ||
            !s(1)
        ) return;

        const vn = i => {
            const n = toNumber(s(i));
            return n === 0 ? "-" : formatNumber(n);
        };

        allData.push({
            ma: s(0),
            ten: s(1),
            diachi: s(2),
            sdt: s(3),
            nvkd: s(4),
            qh1: vn(5),
            qh2: vn(6),
            qh3: vn(7),
            tongqh: vn(8),
            duno: vn(9),
            thanhtoan: s(10),
            muahang: s(11)
        });
    });

    buildNVKD();
    render();
    updateStickyOffset();
}

// Chọn file từ máy: hỗ trợ .xlsx, .xls và .csv
document.getElementById("fileInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;

    if (/\.csv$/i.test(f.name)) {
        f.text().then(t => ingest(csvToRows(t)));
        return;
    }

    f.arrayBuffer().then(buf => {
        try {
            const wb = XLSX.read(buf, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            ingest(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }));
        } catch (err) {
            alert("Không đọc được file Excel: " + err.message);
        }
    });
});

function buildNVKD() {
    const ds = [
        ...new Set(
            allData
            .map(x => x.nvkd)
            .filter(x => x)
        )
    ];

    const select = document.getElementById("nvkdFilter");
    select.innerHTML = '<option value="">Tất cả NVKD</option>';
    ds.sort((a, b) => a.localeCompare(b, "vi"));

    ds.forEach(x => {
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        select.appendChild(op);
    });
}

// ================= BẤM TIÊU ĐỀ ĐỂ SẮP XẾP =================

function setSort(key) {
    if (sortKey !== key) {
        sortKey = key;
        sortAsc = true;
    } else if (sortAsc) {
        sortAsc = false;
    } else {
        sortKey = null;
        sortAsc = false;
    }
    render();
}

document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => setSort(th.dataset.key));
});

function updateArrows() {
    document.querySelectorAll("th[data-key]").forEach(th => {
        const arr = th.querySelector(".arr");
        if (!arr) return;
        arr.textContent = th.dataset.key === sortKey ? (sortAsc ? " ▲" : " ▼") : "";
    });
}

        .value
        .toLowerCase()

        .getElementById("nvkdFilter")

    const body = document.getElementById("dataBody");
    const mobileList = document.getElementById("mobileList");

    body.innerHTML = "";
    mobileList.innerHTML = "";

    const data = allData.filter(r => {

            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.sdt + " " +
            r.nvkd
        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd)
