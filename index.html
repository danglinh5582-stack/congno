<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= KHU VỰC GHIM ĐẦU TRANG ================= */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f3f4f6;
    padding-top: 12px;
    padding-bottom: 8px;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 34px;
    font-weight: bold;
    margin: 4px 0 14px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

input, select {
    padding: 12px 14px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 260px;
    font-size: 20px;
    background: white;
    color: #222;
}

#searchInput {
    flex: 1;
}

/* Ô tích chọn lọc */
.check-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}

.check-filter input[type=checkbox] {
    min-width: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    cursor: pointer;
}

/* Ô chọn file Excel */
.file-pick {
    font-size: 18px;
}

.file-pick input[type=file] {
    min-width: 0;
    width: auto;
    padding: 6px;
    font-size: 16px;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(6, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 4px;
}

.stat {
    background: #0f4c81;
    color: white;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
}

.stat.qh-sub {
    background: #1b639e;
}

.stat h2 {
    font-size: 28px;
    margin: 8px 0 2px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU ================= */

.table-container {
    overflow: visible;
    width: 100%;
    padding-top: 0;
}

table {
    width: 100%;
    min-width: 1500px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: white;
}

thead th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: var(--sticky-offset, 290px);
    z-index: 100;
    font-size: 23px;
    font-weight: bold;
    text-align: center !important;
    vertical-align: middle;
    white-space: normal;
    box-shadow: 0 2px 3px rgba(0,0,0,.15);
    cursor: pointer;
    user-select: none;
}

thead th:hover {
    background: #0b3961;
}

th, td {
    padding: 14px 12px;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 23px;
    line-height: 1.5;
    vertical-align: middle;
}

th:first-child,
td:first-child {
    border-left: 1px solid #ccc;
}

thead th {
    border-top: 1px solid #ccc;
}

td:nth-child(1) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(1) { width: 190px; }

td:nth-child(2) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(2) { width: 190px; }

td:nth-child(3) {
    width: 155px;
    text-align: center;
    overflow-wrap: anywhere;
}
th:nth-child(3) { width: 155px; }

td:nth-child(4),
td:nth-child(5),
td:nth-child(6) {
    width: 125px;
    text-align: right;
    white-space: nowrap;
}
th:nth-child(4), th:nth-child(5), th:nth-child(6) { width: 125px; }

td:nth-child(7),
td:nth-child(8) {
    width: 155px;
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
}
th:nth-child(7), th:nth-child(8) { width: 155px; }

td:nth-child(9),
td:nth-child(10) {
    width: 160px;
    text-align: center;
    white-space: nowrap;
}
th:nth-child(9), th:nth-child(10) { width: 160px; }

tbody tr:nth-child(even) {
    background: #f0f5fb;
}

tbody tr:hover {
    background: #dcecff;
    cursor: pointer;
}

/* ================= THÔNG BÁO ================= */

.empty-message {
    text-align: center;
    padding: 30px;
    font-size: 25px;
    color: #666;
}

/* ================= DANH SÁCH ĐIỆN THOẠI ================= */

.mobile-list {
    display: none;
}

.mobile-table-card {
    background: white;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    overflow-x: auto;
}

.mobile-table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    table-layout: auto;
    background: white;
}

.mobile-table thead th {
    position: static;
    background: #0f4c81;
    color: white;
    font-size: 18px;
    padding: 10px 8px;
    text-align: center !important;
    border: 1px solid #0b3961;

}

.mobile-table tbody td {
    font-size: 18px;
    line-height: 1.4;
    padding: 12px 8px;
    border: 1px solid #d1d5db;
    vertical-align: middle;
}

.mobile-table tbody td:nth-child(1) {
    width: auto;
    text-align: left;

}

.mobile-table tbody td:nth-child(2) {

}

.mobile-table tbody td:nth-child(3) {

}

/* ================= CHI TIẾT KHÁCH HÀNG ================= */

.modal {

.modal-content {

.modal-content h2 {

.modal-content p {

.modal-content hr {

.close {

.label {

.dc-btn-open {

    font-weight: bold;

.dc-btn-open:hover {

}

.dc-modal {

.dc-box {

}

.dc-bar button.close-btn {

.dc-info {

    font-size: 16px;
    color: #555;
    background: #f3f4f6;
}

.dc-view {

    background: #fff;
}

.dc-view img {

    width: 100%;
    height: auto;

}

.dc-error {
    display: none;
    margin: 12px;
    padding: 14px;
    border: 1px solid #f0b4ae;
    border-radius: 8px;
    background: #fdecea;
    color: #7a1f16;
    font-size: 19px;
    line-height: 1.5;
}

.dc-error input[type=file] {
    min-width: 0;
    width: 100%;
    margin-top: 10px;
    font-size: 17px;
    background: #fff;
}

@media (max-width: 1280px) {

}

@media (max-width: 768px) {
    .check-filter.file-pick {

    }

    .file-pick input[type=file] {

        max-width: 100%;
    }

    .dc-bar {
        font-size: 16px;
    }

    .dc-bar button {

        font-size: 16px;
    }

    .dc-view {
        padding: 6px;
    }
}

.dc-toast {

    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    max-width: 92%;
    padding: 12px 18px;
    border-radius: 8px;
    background: #222;
    color: #fff;
    font-size: 18px;
    line-height: 1.4;
    z-index: 1300;
    display: none;
}

/* ================= ĐIỆN THOẠI ================= */

@media (max-width: 768px) {

    body {
        padding: 0 10px 10px 10px;
    }

    .sticky-header {
        position: static;
        padding-top: 10px;
    }

    h1 {
        font-size: 28px;
        line-height: 1.35;
        margin: 8px 0 14px;
    }

    .card {
        padding: 12px;
        margin-bottom: 12px;
    }

    .search-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
    }

    input, select {
        width: 100%;
        min-width: 0;
        padding: 12px 14px;
        font-size: 19px;
    }

    .check-filter {
        font-size: 19px;
    }

    .check-filter input[type=checkbox] {
        width: 24px;
        height: 24px;
        padding: 0;
    }

    .stats {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .stat {
        min-width: 0;
        padding: 12px 16px;
        font-size: 19px;
    }

    .stat h2 {
        font-size: 26px;
        margin: 6px 0 0;
    }

    .table-container {
        display: none;
    }

    .mobile-list {
        display: block;
    }

    .mobile-table thead th {
        cursor: pointer;
        user-select: none;
    }

    .modal {
        padding: 10px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 20px;
        font-size: 21px;
    }

    .modal-content h2 {
        font-size: 25px;
    }

}

@media (max-width: 380px) {

    h1 {
        font-size: 24px;
    }

    .stat h2 {
        font-size: 24px;
    }

    .mobile-table thead th,
    .mobile-table tbody td {
        font-size: 16px;
        padding: 10px 6px;
    }

}

</style>

<body>

<script>

// ================= TỰ ĐỘNG CÂN CHỈNH VỊ TRÍ GHIM TIÊU ĐỀ BẢNG =================

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--sticky-offset', height + 'px');
    }
}

window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

// ================= DỮ LIỆU =================

const CONGNO_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1537914786&single=true&output=csv";
const DETAIL_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgbcKx93iDhkfxCsuBlFEpwuex_SS1X9_PkZ-MTA-7GAUK_QRdLIcvwuYS_wFknMclAQp1meo27-mm/pub?gid=1184385929&single=true&output=csv";

let allData = [];

// Trạng thái sắp xếp (null = thứ tự ban đầu: dư nợ giảm dần)
let sortKey = null;
let sortAsc = true;

const TEXT_KEYS = ["ten", "diachi", "nvkd"];
const DATE_KEYS = ["thanhtoan", "muahang"];

// ================= CHUYỂN ĐỔI SỐ =================

function toNumber(value) {
    let s = String(value ?? "").replace(/[\s\u00A0'"]/g, "");
    if (!s || s === "-") return 0;

    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s[0] === "-") { neg = true; s = s.slice(1); }
    if (!/^[\d.,]+$/.test(s)) return 0;

    const dots = (s.match(/\./g) || []).length;
    const commas = (s.match(/,/g) || []).length;
    let n;

    if (dots && commas) {
        const dec = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
        const thou = dec === "." ? "," : ".";
        n = parseFloat(s.split(thou).join("").replace(dec, "."));
    } else if (commas) {
        n = /^\d{1,3}(,\d{3})+$/.test(s) ? parseFloat(s.replace(/,/g, "")) : parseFloat(s.replace(",", "."));
    } else if (dots) {
        n = /^\d{1,3}(\.\d{3})+$/.test(s) ? parseFloat(s.replace(/\./g, "")) : parseFloat(s);
    } else {
        n = parseFloat(s);
    }

    if (isNaN(n)) return 0;
    return neg ? -n : n;
}

// ================= ĐỊNH DẠNG SỐ & CHỮ =================

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN').format(number);
}

// Chuyển số nguyên thành chữ tiếng Việt cho dòng "Số tiền Qúy khách hàng còn phải thanh toán là: ..."
function numberToVietnameseWords(amount) {
    const rounded = Math.round(Number(amount) || 0);
    if (rounded === 0) return "Không đồng";

    const neg = rounded < 0;
    let num = Math.abs(rounded);

    const units = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
    const scales = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];

    function readThreeDigits(n, hasHigher) {
        const hundred = Math.floor(n / 100);
        const ten = Math.floor((n % 100) / 10);
        const one = n % 10;
        const parts = [];

        if (hundred > 0) {
            parts.push(units[hundred] + " trăm");
        } else if (hasHigher && (ten > 0 || one > 0)) {
            parts.push("không trăm");
        }

        if (ten > 1) {
            parts.push(units[ten] + " mươi");
            if (one === 1) parts.push("mốt");
            else if (one === 4) parts.push("tư");
            else if (one === 5) parts.push("lăm");
            else if (one > 0) parts.push(units[one]);
        } else if (ten === 1) {
            parts.push("mười");
            if (one === 5) parts.push("lăm");
            else if (one > 0) parts.push(units[one]);
        } else if (one > 0) {
            if (hundred > 0 || hasHigher) parts.push("linh");
            parts.push(units[one]);
        }

        return parts.join(" ");
    }

    const groups = [];
    while (num > 0) {
        groups.push(num % 1000);
        num = Math.floor(num / 1000);
    }

    const chunks = [];
    for (let i = groups.length - 1; i >= 0; i--) {
        const g = groups[i];
        if (g > 0) {
            const hasHigher = i < groups.length - 1;
            const text = readThreeDigits(g, hasHigher);
            chunks.push(text + (scales[i] ? " " + scales[i] : ""));
        }
    }

    let result = chunks.join(", ").trim();
    // Viết hoa chữ cái đầu
    result = result.charAt(0).toUpperCase() + result.slice(1);
    if (neg) result = "Âm " + result.charAt(0).toLowerCase() + result.slice(1);

    const isExactThousand = (Math.abs(rounded) % 1000 === 0);
    return result + " đồng" + (isExactThousand ? " chẵn" : "");
}

function dateValue(s) {
    const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0;
}

function sortValue(r, key) {
    if (TEXT_KEYS.includes(key)) return (r[key] || "").toLowerCase();
    if (DATE_KEYS.includes(key)) return dateValue(r[key]);
    return toNumber(r[key]);
}

// ================= NẠP DỮ LIỆU (CSV HOẶC EXCEL) =================

function csvToRows(text) {
    text = text.replace(/^\uFEFF/, "");

    const first = text.split(/\r?\n/, 1)[0] || "";
    const cnt = { ",": 0, ";": 0, "\t": 0 };
    let qq = false;
    for (const ch of first) {
        if (ch === '"') qq = !qq;
        else if (!qq && ch in cnt) cnt[ch]++;
    }
    const d = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || ",";

    const out = [];
    let row = [], cur = "", inQ = false;

    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') {
                if (text[i + 1] === '"') { cur += '"'; i++; }
                else inQ = false;
            } else cur += ch;
        } else if (ch === '"') {
            inQ = true;
        } else if (ch === d) {
            row.push(cur); cur = "";
        } else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            row.push(cur); out.push(row); row = []; cur = "";
        } else {
            cur += ch;
        }
    }
    if (cur !== "" || row.length) { row.push(cur); out.push(row); }

    return out.filter(r => r.some(c => String(c).trim() !== ""));
}

function ingest(rows) {
    allData = [];

    rows.forEach(c => {
        if (c.length < 10) return;

        const s = i => String(c[i] ?? "").trim();

        if (
            s(0).includes('Mã KH') ||
            s(0).includes('M? KH') ||
            s(1).toLowerCase().includes('tổng cộng') ||
            !s(1)
        ) return;

        const vn = i => { const n = toNumber(s(i)); return n === 0 ? "-" : formatNumber(n); };

        allData.push({
            ma: s(0),
            ten: s(1),
            diachi: s(2),
            sdt: s(3),
            nvkd: s(4),
            qh1: vn(5),
            qh2: vn(6),
            qh3: vn(7),
            tongqh: vn(8),
            duno: vn(9),
            thanhtoan: s(10),
            muahang: s(11)
        });
    });

    buildNVKD();
    render();
    updateStickyOffset();
}

// Chọn file từ máy: hỗ trợ .xlsx, .xls và .csv
document.getElementById("fileInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;

    if (/\.csv$/i.test(f.name)) {
        f.text().then(t => ingest(csvToRows(t)));
        return;
    }

    f.arrayBuffer().then(buf => {
        try {
            const wb = XLSX.read(buf, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            ingest(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }));
        } catch (err) {
            alert("Không đọc được file Excel: " + err.message);
        }
    });
});

// ================= TẠO DANH SÁCH NVKD =================

function buildNVKD() {
    const ds = [
        ...new Set(
            allData
            .map(x => x.nvkd)
            .filter(x => x)
        )
    ];

    const select = document.getElementById("nvkdFilter");
    select.innerHTML = '<option value="">Tất cả NVKD</option>';
    ds.sort();

    ds.forEach(x => {
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        select.appendChild(op);
    });
}

// ================= BẤM TIÊU ĐỀ ĐỂ SẮP XẾP =================

function setSort(key) {
    if (sortKey !== key) {
        sortKey = key;
        sortAsc = true;
    } else if (sortAsc) {
        sortAsc = false;
    } else {
        sortKey = null;
        sortAsc = false;
    }
    render();
}

document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => setSort(th.dataset.key));
});

function updateArrows() {
    document.querySelectorAll("th[data-key]").forEach(th => {
        const arr = th.querySelector(".arr");
        if (!arr) return;
        arr.textContent = th.dataset.key === sortKey ? (sortAsc ? " ▲" : " ▼") : "";
    });
}

// ================= HIỂN THỊ DỮ LIỆU =================

function render() {
    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const nvkd = document
        .getElementById("nvkdFilter")
        .value;

    const overdueOnly = document
        .getElementById("overdueOnly")
        .checked;

    const body = document.getElementById("dataBody");
    const mobileList = document.getElementById("mobileList");

    body.innerHTML = "";
    mobileList.innerHTML = "";

    const data = allData.filter(r => {
        const text = (
            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.sdt + " " +
            r.nvkd
        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd)
            && (!overdueOnly || toNumber(r.tongqh) > 0);
    });

    const key = sortKey || "duno";
    const asc = sortKey ? sortAsc : false;

    data.sort((a, b) => {
        const x = sortValue(a, key);
        const y = sortValue(b, key);
        let cmp;
        if (typeof x === "string") cmp = x.localeCompare(y, "vi");
        else cmp = x - y;
        return asc ? cmp : -cmp;
    });

    let tongQH1 = 0;
    let tongQH2 = 0;
    let tongQH3 = 0;
    let tongQH = 0;
    let tongDN = 0;

    const mobileCard = document.createElement("div");
    mobileCard.className = "mobile-table-card";

    const mobileTable = document.createElement("table");
    mobileTable.className = "mobile-table";
    mobileTable.innerHTML = `
        <thead>
            <tr>
                <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                <th data-key="tongqh">Tổng nợ quá hạn<span class="arr"></span></th>
                <th data-key="duno">Dư nợ cuối<span class="arr"></span></th>
            </tr>
        </thead>
    `;
    mobileTable.querySelectorAll("th[data-key]").forEach(th => {
        th.addEventListener("click", () => setSort(th.dataset.key));
    });
    const mobileTbody = document.createElement("tbody");

    data.forEach(r => {
        tongQH1 += toNumber(r.qh1);
        tongQH2 += toNumber(r.qh2);
        tongQH3 += toNumber(r.qh3);
        tongQH += toNumber(r.tongqh);
        tongDN += toNumber(r.duno);

        const tr = document.createElement("tr");
        tr.onclick = () => showDetail(r);

        [
            r.ten,
            r.diachi,
            r.nvkd,
            r.qh1,
            r.qh2,
            r.qh3,
            r.tongqh,
            r.duno,
            r.thanhtoan,
            r.muahang
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
        });

        body.appendChild(tr);

        const mTr = document.createElement("tr");
        mTr.onclick = () => showDetail(r);

        const tdTen = document.createElement("td");
        tdTen.textContent = r.ten || "Chưa có tên khách hàng";

        const tdQH = document.createElement("td");
        tdQH.textContent = r.tongqh || "0";

        const tdDN = document.createElement("td");
        tdDN.textContent = r.duno || "0";

        mTr.appendChild(tdTen);
        mTr.appendChild(tdQH);
        mTr.appendChild(tdDN);
        mobileTbody.appendChild(mTr);
    });

    document.getElementById("emptyTable")
        .style.display = data.length === 0 ? "block" : "none";

    if (data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "Không tìm thấy khách hàng";
        mobileList.appendChild(empty);
    } else {
        mobileTable.appendChild(mobileTbody);
        mobileCard.appendChild(mobileTable);
        mobileList.appendChild(mobileCard);
    }

    document.getElementById("tongkh").innerText = formatNumber(data.length);
    document.getElementById("tongqh1").innerText = formatNumber(tongQH1);
    document.getElementById("tongqh2").innerText = formatNumber(tongQH2);
    document.getElementById("tongqh3").innerText = formatNumber(tongQH3);
    document.getElementById("tongqh").innerText = formatNumber(tongQH);
    document.getElementById("tongdn").innerText = formatNumber(tongDN);

    updateArrows();
}

// ================= CHI TIẾT KHÁCH HÀNG =================

function showDetail(r) {
    document.getElementById("modal").style.display = "block";

    const detail = document.getElementById("detail");
    detail.innerHTML = "";

    const h2 = document.createElement("h2");
    h2.textContent = r.ten;
    detail.appendChild(h2);

    const cleanSdt = (r.sdt || "").trim();
    const sdtDisplay = cleanSdt && cleanSdt !== "0" ? cleanSdt : "Chưa cập nhật";

    const fields = [
        ["Mã KH:", r.ma],
        ["Số điện thoại:", sdtDisplay, true],
        ["Địa chỉ:", r.diachi],
        ["NVKD:", r.nvkd],
        ["Quá hạn 1 tháng:", r.qh1],
        ["Quá hạn 2 tháng:", r.qh2],
        ["Quá hạn 3 tháng:", r.qh3],
        ["Tổng công nợ quá hạn:", r.tongqh],
        ["Dư nợ cuối ngày:", r.duno],
        ["Ngày thanh toán gần nhất:", r.thanhtoan],
        ["Ngày mua hàng gần nhất:", r.muahang]
    ];

    fields.forEach((item, index) => {
        if (index === 4 || index === 9) {
            detail.appendChild(document.createElement("hr"));
        }

        const p = document.createElement("p");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0] + " ";
        p.appendChild(label);

        if (item[2] && item[1] !== "Chưa cập nhật") {
            const link = document.createElement("a");
            link.href = "tel:" + item[1].replace(/[^0-9+]/g, '');
            link.className = "phone-link";
            link.textContent = item[1];
            p.appendChild(link);
        } else {
            p.appendChild(document.createTextNode(item[1] || "Chưa cập nhật"));
        }

        detail.appendChild(p);
    });

    const dcBtn = document.createElement("button");
    dcBtn.type = "button";
    dcBtn.className = "dc-btn-open";
    dcBtn.textContent = "Đối chiếu công nợ";
    dcBtn.onclick = () => openRecon(r);
    detail.appendChild(dcBtn);
}

function parseVN(s) {
    return toNumber(s);

// Hỗ trợ cả "dd/mm/yyyy" và "yyyy-mm-dd"
function toYMD(d) {
    const s = String(d || "").trim();
    const mDMY = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (mDMY) return (+mDMY[3]) * 10000 + (+mDMY[2]) * 100 + (+mDMY[1]);
    const mYMD = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (mYMD) return (+mYMD[1]) * 10000 + (+mYMD[2]) * 100 + (+mYMD[3]);
    return 0;
}

// 20260603 -> "03/06/26" (định dạng dd/mm/yy)
function fmtYMD(n) {
    return pad2(n % 100) + "/" + pad2(Math.floor(n / 100) % 100) + "/" + pad2(Math.floor(n / 10000) % 100);
}

// 20260603 -> "2026-06-03" (cho ô chọn ngày)
function ymdToInput(n) {
    return Math.floor(n / 10000) + "-" + pad2(Math.floor(n / 100) % 100) + "-" + pad2(n % 100);
}

const money = n => {
    const r = Math.round(n);
    return (r < 0 ? "-" : "") + Math.abs(r).toString().replace(/\B(?=(\d{3})+(?!\d))/g, THOUSAND);
};

const qtyText = n => String(Math.round(Math.abs(n) * 100) / 100);

// Nhận diện trường hợp NVKD thu tiền của khách chưa nộp về công ty
function isNvkdCollected(desc, general) {
    const txt = normKey((desc || "") + " " + (general || ""));
    return /nvkd\b.*thu\s*ti[eề]n.*ch[uư]a\s*n[oộ]p/i.test(txt)
        || /nvkd\b.*thu\s*c[uủ]a\s*kh[aá]ch.*ch[uư]a\s*n[oộ]p/i.test(txt)
        || /thu\s*ti[eề]n.*ch[uư]a\s*n[oộ]p\s*l[aạ]i/i.test(txt);
}

function parseDetail(text) {
    const lines = csvToRows(text);
    const head = (lines[0] || []).map(s => String(s).trim());
    const ix = (name, def) => { const i = head.indexOf(name); return i >= 0 ? i : def; };

    const C = {
        ten: ix("Tên khách hàng", 0), ma: ix("Mã khách hàng", 1),
        ngayHT: ix("Ngày hạch toán", 2), ngayCT: ix("Ngày chứng từ", 3),
        so: ix("Số chứng từ", 4), dg: ix("Diễn giải", 5), dgc: ix("Diễn giải chung", 6),
        no: ix("Phát sinh Nợ", 9), co: ix("Phát sinh Có", 10),
        sdNo: ix("Số dư Nợ", 11), sdCo: ix("Số dư Có", 12),
        mh: ix("Mã hàng", 13), th: ix("Tên hàng", 14), dvt: ix("ĐVT", 15), sl: ix("Số lượng", 16)
    };

    const byCode = new Map(), byName = new Map();
    const add = (map, key, row) => {
        if (!key) return;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(row);
    };

    for (let i = 1; i < lines.length; i++) {
        const c = lines[i];
        const ten = (c[C.ten] || "").trim();
        const ma = (c[C.ma] || "").trim();
        if (!ma) continue;

        const desc = (c[C.dg] || "").trim();
        const general = (c[C.dgc] || "").trim();
        const date = (c[C.ngayCT] || c[C.ngayHT] || "").trim();

        const row = {
            opening: normKey(desc) === "số dư đầu kỳ",
            date: date,
            ymd: toYMD(date),
            voucher: (c[C.so] || "").trim(),
            desc: desc,
            general: general,
            isNvkd: isNvkdCollected(desc, general),
            no: parseVN(c[C.no]),
            co: parseVN(c[C.co]),
            bal: parseVN(c[C.sdNo]) - parseVN(c[C.sdCo]),
            ma: (c[C.mh] || "").trim(),
            ten: (c[C.th] || "").trim(),
            dvt: (c[C.dvt] || "").trim(),
            sl: parseVN(c[C.sl])
        };

        add(byCode, normKey(ma), row);
        add(byName, normKey(ten), row);
    }

    return { byCode, byName };
}

async function ensureDetail() {
    if (detailIndex) return;
    const r = await fetch(DETAIL_SHEET_URL + "&t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("Không tải được dữ liệu chi tiết công nợ từ Google Sheet.");
    detailIndex = parseDetail(await r.text());
}

// ---------- Tính dữ liệu đối chiếu ----------

function buildLines(slice) {
    const lines = [];
    const keyed = new Map();

    slice.forEach(r => {
        if (r.ma) {
            const key = r.voucher + "|" + r.ma;
            let L = keyed.get(key);
            if (!L) {
                L = {
                    kind: "prod",
                    date: r.date,
                    ten: r.ten || r.desc,
                    dvt: "",
                    sl: 0,
                    net: 0,
                    general: r.general,
                    desc: r.desc,
                    isNvkd: r.isNvkd
                };
                keyed.set(key, L);
                lines.push(L);
            }
            L.net += r.no - r.co;
            L.sl += r.sl;
            if (r.dvt && !L.dvt) L.dvt = r.dvt;
            if (r.isNvkd) L.isNvkd = true;
        } else {
            lines.push({
                kind: "free",
                date: r.date,
                ten: r.desc,
                dvt: r.dvt || "",
                sl: r.sl || 0,
                net: r.no - r.co,
                general: r.general,
                isNvkd: r.isNvkd
            });
        }
    });

    const out = [];
    lines.forEach(L => {
        const net = Math.round(L.net);
        if (net === 0) return;

        if (L.kind === "prod") {
            const absSl = Math.abs(L.sl);
            if (net > 0) {
                out.push({
                    date: L.date,
                    label: L.isNvkd ? "Thu tiền từ NVKD" : ("Bán hàng " + L.ten),
                    dvt: L.dvt || "",
                    sl: L.sl,
                    price: L.sl ? Math.round(net / L.sl) : 0,
                    debit: net,
                    credit: 0
                });
            } else {
                const isReturn = L.sl < 0 || /trả lại|thu lại/i.test(L.general || L.ten || "");
                const unitPrice = absSl ? Math.round(Math.abs(net) / absSl) : 0;
                out.push({
                    date: L.date,
                    label: L.isNvkd
                        ? "Thu tiền từ NVKD"
                        : ((isReturn ? "Trả lại hàng " : "Giảm giá ") + L.ten),
                    dvt: isReturn ? (L.dvt || "") : "",
                    sl: absSl,
                    price: isReturn ? unitPrice : 0,
                    debit: 0,
                    credit: -net
                });
            }
        } else if (net < 0) {
            out.push({
                date: L.date,
                label: L.isNvkd ? "Thu tiền từ NVKD" : L.ten,
                dvt: L.dvt || "",
                sl: 0,
                price: 0,
                debit: 0,
                credit: -net
            });
        } else {
            out.push({
                date: L.date,
                label: L.isNvkd ? "Thu tiền từ NVKD" : L.ten,
                dvt: L.dvt || "",
                sl: 0,
                price: 0,
                debit: net,
                credit: 0
            });
        }
    });

    return out;
}

function buildRecon(rows, fromYMD) {
    const op = rows.find(r => r.opening);
    const tx = rows.filter(r => !r.opening);
    const openBal = op ? op.bal : 0;
    const year = tx.length ? Math.floor(tx[tx.length - 1].ymd / 10000) : new Date().getFullYear();

    let startIdx = 0, opening = openBal;
    let startYMD = year * 10000 + 101;
    let mode = "year";

    if (fromYMD) {
        mode = "manual";
        let i = tx.findIndex(r => r.ymd >= fromYMD);
        if (i < 0) i = tx.length;
        startIdx = i;
        opening = i > 0 ? tx[i - 1].bal : openBal;
        startYMD = fromYMD;
    } else {
        let z = -1;
        tx.forEach((r, i) => {
            if (Math.floor(r.ymd / 10000) === year && Math.abs(r.bal) < 0.5) z = i;
        });
        if (z >= 0) {
            while (z + 1 < tx.length && tx[z + 1].voucher === tx[z].voucher) z++;
            mode = "zero";
            startIdx = z + 1;
            opening = tx[z].bal;
            startYMD = tx[startIdx] ? tx[startIdx].ymd : tx[z].ymd;
        } else if (Math.abs(openBal) < 0.5) {
            mode = "year";
        }
    }

    const lines = buildLines(tx.slice(startIdx));
    const sumDebit = lines.reduce((s, L) => s + L.debit, 0);
    const sumCredit = lines.reduce((s, L) => s + L.credit, 0);

    return {
        mode, opening, startYMD, lines, sumDebit, sumCredit,
        end: opening + sumDebit - sumCredit,
        fileEnd: tx.length ? tx[tx.length - 1].bal : openBal
    };
}

let qrImagePromise = null;
function loadQR() {
    if (!qrImagePromise) {
        qrImagePromise = new Promise(res => {
            const im = new Image();
            im.onload = () => res(im);
            im.onerror = () => res(null);
            im.src = QR_SRC;
        });
    }
    return qrImagePromise;
}

async function drawRecon(d, custName) {
    const qr = await loadQR();

    const SCALE = 2, W = 1100, M = 24, PAD = 8, LH = 23;
    const FONT = '"Times New Roman", "Liberation Serif", Times, serif';
    const f = (px, bold, ital) => (ital ? "italic " : "") + (bold ? "bold " : "") + px + "px " + FONT;

    const mc = document.createElement("canvas").getContext("2d");
    const tw = (t, font) => { mc.font = font; return mc.measureText(String(t)).width; };
    const wrap = (t, font, maxW) => {
        mc.font = font;
        const out = []; let cur = "";
        String(t).split(/\s+/).forEach(w => {
            const test = cur ? cur + " " + w : w;
            if (!cur || mc.measureText(test).width <= maxW) cur = test;
            else { out.push(cur); cur = w; }
        });
        if (cur) out.push(cur);
        return out;
    };

    const BODY = f(18), BOLD = f(18, true);
    const nowObj = new Date();
    const printDate = pad2(nowObj.getDate()) + "/" + pad2(nowObj.getMonth() + 1) + "/" + pad2(nowObj.getFullYear() % 100);
    const fullDateText = pad2(nowObj.getDate()) + "/" + pad2(nowObj.getMonth() + 1) + "/" + nowObj.getFullYear();
    const shortD = s => { const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? pad2(m[1]) + "/" + pad2(m[2]) + "/" + m[3].slice(2) : s; };

    const rows = d.lines.map((L, i) => ({
        tt: String(i + 1),
        date: shortD(L.date),
        name: L.label,
        dvt: L.dvt || "",
        sl: L.sl ? qtyText(L.sl) : "-",
        price: L.price ? money(L.price) : "-",
        debit: L.debit ? money(L.debit) : "-",
        credit: L.credit ? money(L.credit) : "-"
    }));

    const heads = ["TT", "Ngày/tháng", "Tên hàng", "ĐVT", "SL", "Đơn giá", "Thành tiền", "Thanh toán/Trả lại hàng/Giảm giá"];
    const headPay = ["Thanh toán/", "Trả lại hàng/", "Giảm giá"];

    const cw = new Array(8).fill(0);
    const fit = [0, 1, 3, 4, 5, 6, 7];
    fit.forEach(k => {
        if (k === 7) cw[k] = Math.max(...headPay.map(t => tw(t, BOLD)));
        else cw[k] = tw(heads[k], BOLD);
    });
    rows.forEach(r => {
        cw[0] = Math.max(cw[0], tw(r.tt, BODY));
        cw[1] = Math.max(cw[1], tw(r.date, BODY));
        cw[3] = Math.max(cw[3], tw(r.dvt, BODY));
        cw[4] = Math.max(cw[4], tw(r.sl, BODY));
        cw[5] = Math.max(cw[5], tw(r.price, BODY));
        cw[6] = Math.max(cw[6], tw(r.debit, BODY));
        cw[7] = Math.max(cw[7], tw(r.credit, BODY));
    });
    const sDebit = d.sumDebit ? money(d.sumDebit) : "-", sCredit = d.sumCredit ? money(d.sumCredit) : "-";
    const sOpen = money(d.opening), sEnd = money(d.end);
    cw[6] = Math.max(cw[6], tw(sDebit, BOLD), tw(sCredit, BOLD), tw(sEnd, BOLD));
    cw[7] = Math.max(cw[7], tw(sCredit, BOLD), tw(sOpen, BOLD), tw("Đồng", BODY));
    for (let k = 0; k < 8; k++) if (k !== 2) cw[k] = Math.ceil(cw[k]) + PAD * 2;

    const tableW = W - M * 2;
    cw[2] = tableW - cw.reduce((s, v, k) => (k === 2 ? s : s + v), 0);
    const colX = [];
    cw.reduce((x, w, k) => { colX[k] = x; return x + w; }, M);

    rows.forEach(r => {
        r.nameLines = wrap(r.name, BODY, cw[2] - PAD * 2);
        r.h = Math.max(1, r.nameLines.length) * LH + 12;
    });
    const headH = 3 * LH + 10;
    const totalH = LH + 14;

    const hdrTop = 20, hdrH = 150, leftW = 430, qrSize = 148;
    const qx = M + leftW + 20;
    const rx = qx + qrSize + 24, rw = W - M - rx;
    const titleLines = wrap("BIÊN BẢN ĐỐI CHIẾU VÀ XÁC NHẬN CÔNG NỢ KIÊM GIẤY GHI NHẬN NỢ CỦA KHÁCH HÀNG", f(22, true), rw);

    const custLabel = "Khách hàng:";
    const dateText = "Ngày lập đối chiếu: " + printDate;
    const nameX = M + tw(custLabel, f(21, true)) + 14;
    const nameMax = W - M - tw(dateText, f(19, false, true)) - 24 - nameX;
    const nameLines = wrap(custName, f(23, true), nameMax);
    const custH = Math.max(1, nameLines.length) * 28 + 6;

    // Phần đuôi xác nhận công nợ theo ảnh mẫu
    const amountWords = numberToVietnameseWords(d.end);
    const amountWordsLine = "Số tiền Qúy khách hàng còn phải thanh toán là: " + amountWords;
    const sigHeaderH = 34;
    const sigSpaceH = 115;
    const sigMetaH = 30;
    const noteBoxH = 105;
    const footerNotesH = 66;
    const tailH = sigHeaderH + sigSpaceH + sigMetaH + 14 + noteBoxH + 12 + footerNotesH;

    const H = hdrTop + hdrH + 14 + custH + 6 + 30 + headH + rows.reduce((s, r) => s + r.h, 0) + totalH + 20 + 68 + tailH + 24;

    const cv = document.createElement("canvas");
    cv.width = W * SCALE;
    cv.height = Math.ceil(H) * SCALE;
    const ctx = cv.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#000";
    ctx.textBaseline = "middle";

    const text = (t, x, y, font, align, color) => {
        ctx.font = font; ctx.textAlign = align || "left"; ctx.fillStyle = color || "#000";
        ctx.fillText(String(t), x, y);
    };
    const fitText = (t, cx, y, maxW, px, bold) => {
        while (px > 11 && tw(t, f(px, bold)) > maxW) px--;
        text(t, cx, y, f(px, bold), "center");
    };

    // --- Đầu trang ---
    const lcx = M + leftW / 2;
    fitText(COMPANY.name, lcx, hdrTop + 34, leftW, 24, true);
    fitText(COMPANY.addr, lcx, hdrTop + 72, leftW, 19, true);
    fitText(COMPANY.bank, lcx, hdrTop + 106, leftW, 19, true);

    ctx.strokeStyle = "#1f4e8c"; ctx.lineWidth = 1.5;
    ctx.strokeRect(qx, hdrTop, qrSize, qrSize);
    if (qr) ctx.drawImage(qr, qx + 5, hdrTop + 5, qrSize - 10, qrSize - 10);

    const tTop = hdrTop + (hdrH - titleLines.length * 30) / 2 + 10;
    titleLines.forEach((t, i) => text(t, rx + rw / 2, tTop + i * 30 + 15, f(22, true), "center"));

    // --- Khách hàng + ngày lập ---
    let y = hdrTop + hdrH + 14;
    text(custLabel, M, y + 17, f(21, true), "left");
    nameLines.forEach((t, i) => text(t, nameX, y + 17 + i * 28, f(23, true), "left"));
    text(dateText, W - M, y + 17, f(19, false, true), "right");
    y += custH + 6;

    // --- Dư nợ đầu ngày dd/mm/yy: ---
    text("Dư nợ đầu ngày " + fmtYMD(d.startYMD) + ":", colX[7] - PAD, y + 15, BOLD, "right");
    text(sOpen, colX[7] + cw[7] - PAD, y + 15, BOLD, "right");
    y += 30;

    // --- Bảng ---
    ctx.strokeStyle = "#444"; ctx.lineWidth = 1;
    const cell = (k, top, h) => ctx.strokeRect(colX[k] + 0.5, top + 0.5, cw[k], h);

    for (let k = 0; k < 8; k++) {
        cell(k, y, headH);
        if (k === 7) headPay.forEach((t, i) => text(t, colX[k] + cw[k] / 2, y + 5 + LH * i + LH / 2, BOLD, "center"));
        else text(heads[k], colX[k] + cw[k] / 2, y + headH / 2, BOLD, "center");
    }
    y += headH;

    rows.forEach(r => {
        const mid = y + r.h / 2;
        for (let k = 0; k < 8; k++) cell(k, y, r.h);

        text(r.tt, colX[0] + cw[0] / 2, mid, BODY, "center");
        text(r.date, colX[1] + cw[1] / 2, mid, BODY, "center");
        const startY = y + (r.h - r.nameLines.length * LH) / 2 + LH / 2;
        r.nameLines.forEach((t, i) => text(t, colX[2] + PAD, startY + i * LH, BODY, "left"));
        text(r.dvt, colX[3] + cw[3] / 2, mid, BODY, "center");
        text(r.sl, colX[4] + cw[4] / 2, mid, BODY, "center");
        text(r.price, colX[5] + cw[5] - PAD, mid, BODY, "right");
        text(r.debit, colX[6] + cw[6] - PAD, mid, BODY, "right");
        text(r.credit, colX[7] + cw[7] - PAD, mid, BODY, "right");
        y += r.h;
    });

    // Dòng cộng
    for (let k = 0; k < 8; k++) cell(k, y, totalH);
    text("Cộng", colX[2] + PAD, y + totalH / 2, BOLD, "left");
    text(sDebit, colX[6] + cw[6] - PAD, y + totalH / 2, BOLD, "right");
    text(sCredit, colX[7] + cw[7] - PAD, y + totalH / 2, BOLD, "right");
    y += totalH + 20;

    // --- Tổng kết thanh toán ---
    text("Số tiền đã thanh toán:", colX[6] - 8, y + 15, f(20, true), "right");
    text(sCredit, colX[6] + cw[6] - PAD, y + 15, f(20, true), "right");
    text("Đồng", colX[7] + PAD, y + 15, f(20), "left");
    y += 32;

    ctx.fillStyle = "#92d050";
    ctx.fillRect(colX[6], y - 1, cw[6], 32);
    ctx.strokeStyle = "#444";
    ctx.strokeRect(colX[6] + 0.5, y - 0.5, cw[6], 32);
    text("Số tiền còn phải thanh toán:", colX[6] - 8, y + 15, f(20, true), "right");
    text(sEnd, colX[6] + cw[6] - PAD, y + 15, f(20, true), "right");
    text("Đồng", colX[7] + PAD, y + 15, f(20), "left");
    y += 46;

    // --- Đuôi biên bản: 4 cột chữ ký + số tiền bằng chữ + ghi chú + lưu ý ---
    const sigCols = [
        { title: "Xác nhận của Khách hàng", w: 300 },
        { title: "Giám đốc", w: 220 },
        { title: "Nhân viên kinh doanh", w: 270 },
        { title: "Kế toán bán hàng", w: tableW - (300 + 220 + 270) }
    ];
    let sx = M;
    ctx.strokeStyle = "#666";
    ctx.lineWidth = 1;
    sigCols.forEach(sc => {
        ctx.strokeRect(sx + 0.5, y + 0.5, sc.w, sigHeaderH);
        text(sc.title, sx + sc.w / 2, y + sigHeaderH / 2, f(19, true), "center");

        ctx.strokeRect(sx + 0.5, y + sigHeaderH + 0.5, sc.w, sigSpaceH);
        sx += sc.w;
    });
    const sigBottomY = y + sigHeaderH + sigSpaceH;

    // Dòng "Tính đến ngày" & "Số tiền Qúy khách hàng còn phải thanh toán là: ..."
    text("Tính đến ngày", M + 95, sigBottomY + 15, f(18, false, true), "left");
    text(fullDateText, M + 255, sigBottomY + 15, f(18, false, true), "left");
    fitText(amountWordsLine, M + 560, sigBottomY + 15, tableW - 260, 18, false);
    text(amountWordsLine, M + 95, sigBottomY + 42, f(18, false, true), "left");

    y = sigBottomY + 62;

    // Khung Ghi chú có các dòng kẻ ngang
    ctx.strokeStyle = "#444";
    ctx.strokeRect(M + 0.5, y + 0.5, tableW, noteBoxH);
    text("Ghi chú", M + 8, y + 14, f(18, true, true), "left");
    for (let lineIdx = 1; lineIdx <= 3; lineIdx++) {
        const ly = y + 26 + lineIdx * 20;
        ctx.beginPath();
        ctx.setLineDash(lineIdx === 3 ? [] : [4, 3]);
        ctx.moveTo(M + 1, ly);
        ctx.lineTo(M + tableW - 1, ly);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    y += noteBoxH + 14;

    // Lưu ý chân trang
    text("Lưu ý:", M, y + 10, f(18, true, true), "left");
    text("- Công ty chỉ có một số tài khoản trên, mọi số tài khoản khác đều không hợp lệ.", M, y + 32, f(18, true, true), "left");
    text("- Mọi thắc mắc và khiếu nại xin vui lòng gọi về số điện thoại (kèm zalo) trực tiếp CTHĐTV - GĐ: 0986.378.288 và 0941.266.688 - Mr. Nguyễn Thông.", M, y + 54, f(18, true, true), "left");

    return cv;
}

// ---------- Giao diện đối chiếu ----------

function showToast(msg) {
    const t = byId("dcToast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { t.style.display = "none"; }, 7000);
}

function slug(s) {
    return String(s || "khach").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d").replace(/Đ/g, "D").replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function setDcError(msg) {
    byId("dcError").style.display = msg ? "block" : "none";
    byId("dcErrorText").textContent = msg || "";
}

async function openRecon(r) {
    reconState = { cust: r, from: "", blob: null, fileName: "", model: null };
    byId("dcModal").style.display = "block";
    byId("dcImg").style.display = "none";
    byId("dcExcel").disabled = true;
    byId("dcDownload").disabled = true;
    byId("dcZalo").disabled = true;
    byId("dcFrom").value = "";
    setDcError("");
    byId("dcInfo").textContent = "Đang tải dữ liệu chi tiết công nợ từ Google Sheet...";

    try {
        await ensureDetail();
    } catch (e) {
        byId("dcInfo").textContent = "";
        setDcError(e.message + " Bạn có thể chọn file CSV từ máy:");
        return;
    }
    refreshRecon();
}

async function refreshRecon() {
    const r = reconState.cust;
    const rows = detailIndex.byCode.get(normKey(r.ma)) || detailIndex.byName.get(normKey(r.ten));

    if (!rows || !rows.length) {
        byId("dcImg").style.display = "none";
        byId("dcExcel").disabled = true;
        byId("dcInfo").textContent = "Không tìm thấy khách \"" + r.ten + "\" (mã " + r.ma + ") trong file chi tiết công nợ.";
        return;
    }

    const fromYMD = reconState.from ? toYMD(reconState.from) : 0;
    const d = buildRecon(rows, fromYMD);
    reconState.model = d;
    byId("dcExcel").disabled = false;

    byId("dcFrom").value = ymdToInput(d.startYMD);

    let note;
    if (d.mode === "manual") note = "Bạn chọn từ ngày " + fmtYMD(d.startYMD) + ".";
    else if (d.mode === "zero") note = "Tự động: công nợ về 0 lần cuối, lấy dữ liệu từ " + fmtYMD(d.startYMD) + ".";
    else note = "Tự động: công nợ chưa hết trong năm, lấy từ 01/01/" + pad2(Math.floor(d.startYMD / 10000) % 100) + ".";
    if (Math.abs(d.end - d.fileEnd) > 1) note += " (Lưu ý: dư nợ tính lại khác file " + money(d.fileEnd) + ")";
    if (!d.lines.length) note += " Không có phát sinh trong kỳ này.";
    byId("dcInfo").textContent = note;

    const cv = await drawRecon(d, r.ten);
    const img = byId("dcImg");
    img.src = cv.toDataURL("image/png");
    img.style.display = "block";

    cv.toBlob(b => {
        reconState.blob = b;
        const nowObj = new Date();
        const stamp = pad2(nowObj.getDate()) + "-" + pad2(nowObj.getMonth() + 1) + "-" + pad2(nowObj.getFullYear() % 100);
        reconState.fileName = "DoiChieuCongNo_" + slug(r.ten) + "_" + stamp + ".png";
        byId("dcDownload").disabled = !b;
        byId("dcZalo").disabled = !b;
    }, "image/png");
}

function downloadRecon() {
    if (!reconState.blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(reconState.blob);
    a.download = reconState.fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function shareZalo() {
    if (!reconState.blob) return;
    const file = new File([reconState.blob], reconState.fileName, { type: "image/png" });

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let errName = "";

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({ files: [file], title: "Đối chiếu công nợ " + reconState.cust.ten });
            return;
        } catch (e) {
            if (e && e.name === "AbortError") return;
            errName = (e && e.name) || "";
        }
    }

    if (isMobile) {
        downloadRecon();
        showToast("Trình duyệt này không mở được bảng chia sẻ" + (errName ? " (" + errName + ")" : "") +
            ". Đã tải ảnh về máy: hãy mở Zalo, chọn khách rồi gửi ảnh vừa tải trong thư viện ảnh.");
        return;
    }

    window.open("https://chat.zalo.me/", "_blank");
    let copied = false;
    try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": reconState.blob })]);
        copied = true;
    } catch (e) {}
    downloadRecon();
    showToast(copied
        ? "Đã sao chép ảnh và tải về máy. Mở khung chat Zalo của khách rồi bấm Ctrl+V để gửi."
        : "Đã tải ảnh về máy. Mở khung chat Zalo của khách rồi chọn ảnh vừa tải để gửi.");
}

function closeRecon() {
    byId("dcModal").style.display = "none";
}

byId("dcFrom").addEventListener("change", e => {
    reconState.from = e.target.value ? e.target.value.split("-").reverse().join("/") : "";
    if (detailIndex && reconState.cust) refreshRecon();
});
byId("dcAuto").addEventListener("click", () => {
    reconState.from = "";
    if (detailIndex && reconState.cust) refreshRecon();
});
byId("dcExcel").addEventListener("click", exportReconExcel);
byId("dcDownload").addEventListener("click", downloadRecon);
byId("dcZalo").addEventListener("click", shareZalo);
byId("dcClose").addEventListener("click", closeRecon);
byId("dcCsv").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(t => {
        detailIndex = parseDetail(t);
        setDcError("");
        refreshRecon();
    });
});

// ================= ĐÓNG CHI TIẾT =================

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("modal").addEventListener("click", function(e) {
    if (e.target === this) {
        closeModal();
    }
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        if (byId("dcModal").style.display === "block") closeRecon();
        else closeModal();
    }
});

</script>
